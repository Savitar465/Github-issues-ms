spring:
  application:
    name: Github-issues-ms

  # ===== DATASOURCE (In-Memory H2) =====
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ===== JPA =====
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ===== SECURITY: Disabled for tests =====
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/githubx
          jwk-set-uri: http://localhost:8080/realms/githubx/protocol/openid-connect/certs

  # ===== REDIS: Disabled =====
  data:
    redis:
      enabled: false

# ===== SERVIDOR =====
server:
  port: 8084

# ===== LOGGING =====
logging:
  level:
    root: WARN
    com.githubx: DEBUG
